<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Peshawars.com</title>
    <link rel="icon" type="image/png" href="./favicon.png?v=3" />
    <script>
      (function() {
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var base = path.startsWith('/peshawer') ? '/peshawer' : '';
        var route = path.slice(base.length).replace(/\/+$/, '') || '/';
        window.location.replace((base ? base : '') + '/#' + route + search + hash);
      })();
    </script>
  </head>
  <body></body>
</html>
