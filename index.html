<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peshawars.com</title>
    <meta name="description" content="Discover premium real estate, residential developments, luxury apartments, and investment opportunities in Peshawar, Kalam, and Swat." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Path to HashRouter redirect script for direct URL navigation on GitHub Pages / Vercel -->
    <script>
      (function() {
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash;
        var base = path.startsWith('/peshawer') ? '/peshawer' : '';
        var route = path.slice(base.length).replace(/\/+$/, '') || '/';
        if (route && route !== '/' && route !== '/index.html' && !hash) {
          window.location.replace((base ? base : '') + '/#' + route + search);
        }
      })();
    </script>
  </head>
  <body class="bg-[#F8F6EA] text-[#102A24] font-body antialiased selection:bg-[#D6A84F] selection:text-[#022C22]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
